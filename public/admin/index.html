<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #e5e5e5;
      --text: #1a1a1a;
      --text-muted: #888;
      --accent: #1a1a1a;
      --danger: #c0392b;
      --success: #27ae60;
      --radius: 4px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ===== Login ===== */
    .login-wrap {
      max-width: 440px;
      margin: 80px auto;
      padding: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .login-wrap h1 { font-size: 22px; font-weight: 400; margin-bottom: 8px; }
    .login-wrap p { color: var(--text-muted); margin-bottom: 24px; font-size: 13px; }
    .login-wrap input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: monospace;
      margin-bottom: 12px;
    }
    .login-wrap input:focus { outline: none; border-color: var(--text); }
    .login-wrap .hint { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.8; }
    .login-wrap .hint a { color: var(--text); text-decoration: underline; }
    .btn { display: inline-block; padding: 10px 24px; border: 1px solid var(--text); background: var(--text); color: #fff; border-radius: var(--radius); cursor: pointer; font-size: 14px; transition: opacity .2s; }
    .btn:hover { opacity: 0.85; }
    .btn-outline { background: transparent; color: var(--text); }
    .btn-sm { padding: 6px 14px; font-size: 13px; }
    .btn-danger { background: var(--danger); border-color: var(--danger); }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }

    /* ===== Layout ===== */
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      flex-shrink: 0;
    }
    .sidebar .logo { padding: 0 24px 24px; font-size: 16px; font-weight: 500; border-bottom: 1px solid var(--border); }
    .sidebar .logo a { color: var(--text-muted); font-size: 12px; text-decoration: none; margin-left: 8px; }
    .sidebar nav { padding: 16px 0; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      transition: background .15s;
    }
    .sidebar nav a:hover { background: #f5f5f5; }
    .sidebar nav a.active { background: #f0f0f0; font-weight: 500; }
    .sidebar nav a .icon { width: 18px; text-align: center; font-size: 15px; }
    .sidebar .logout { padding: 16px 24px; border-top: 1px solid var(--border); margin-top: auto; }
    .sidebar .logout a { color: var(--danger); text-decoration: none; font-size: 13px; }

    .main { flex: 1; padding: 40px 48px; overflow-x: hidden; }
    .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .main-header h2 { font-size: 24px; font-weight: 400; }
    .main-header .actions { display: flex; gap: 10px; }

    .item-list { display: flex; flex-direction: column; gap: 1px; }
    .item-row {
      display: flex;
      align-items: center;

    .item-row .thumb { width: 48px; height: 48px; border-radius: var(--radius); object-fit: cover; background: #eee; flex-shrink: 0; }

    .loading { text-align: center; padding: 60px; color: var(--text-muted); }
    .loading .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: var(--radius);
      color: #fff;
      font-size: 14px;
      z-index: 9999;
      animation: slideUp .3s ease;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .back-link { font-size: 13px; color: var(--text-muted); text-decoration: none; margin-bottom: 16px; display: inline-block; }
    .back-link:hover { color: var(--text); }
    .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty .empty-icon { font-size: 40px; margin-bottom: 12px; }

    .rte-toolbar {

      gap: 2px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-bottom: none;

// ============================================================
// GITHUB API
// ============================================================
async function ghApi(path, options = {}) {
  const url = `${API}/repos/${REPO_OWNER}/${REPO_NAME}${path}`;
  const headers = {
    'Authorization': `token ${token}`,
    'Accept': 'application/vnd.github.v3+json',
    'User-Agent': 'shenkephoto-cms',
    ...options.headers,
  };
  const resp = await fetch(url, { ...options, headers });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.message || `GitHub API error: ${resp.status}`);
  }
  return resp;
}

// UTF-8 safe base64 encode/decode
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

function base64ToUtf8(b64) {
  const binary = atob(b64.replace(/\n/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

async function ghGetJson(path) {
  const resp = await ghApi(`/contents/${path}`);
  const data = await resp.json();
  return {
    content: JSON.parse(base64ToUtf8(data.content)),
    sha: data.sha,
  };
}

async function ghListDir(dir) {
  const resp = await ghApi(`/contents/${dir}`);
  return await resp.json();
}

async function ghSaveJson(path, content, sha, message) {
  const body = {
    message: message || `Update ${path}`,
    content: utf8ToBase64(JSON.stringify(content, null, 2)),
    branch: REPO_BRANCH,
  };
  if (sha) body.sha = sha;
  const resp = await ghApi(`/contents/${path}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return await resp.json();
}

async function ghDeleteFile(path, sha, message) {
  const body = { message: message || `Delete ${path}`, sha, branch: REPO_BRANCH };
  await ghApi(`/contents/${path}`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
}

  // No-op: website fetches content from jsDelivr CDN at runtime

// Update manifest.json when content is created or deleted
async function updateManifest(collectionKey, contentId, action) {
  // action: 'add' or 'remove'
  const manifestPath = 'src/content/manifest.json';
  try {
    const resp = await ghApi(`/contents/${manifestPath}`);
    const data = await resp.json();
    const manifest = JSON.parse(base64ToUtf8(data.content));
    if (!manifest[collectionKey]) manifest[collectionKey] = [];
    if (action === 'add' && !manifest[collectionKey].includes(contentId)) {
      manifest[collectionKey].push(contentId);
    } else if (action === 'remove') {
      manifest[collectionKey] = manifest[collectionKey].filter(id => id !== contentId);
    }
    await ghSaveJson(manifestPath, manifest, data.sha, `Update manifest: ${action} ${contentId} in ${collectionKey}`);
  } catch (e) {
    console.warn('Failed to update manifest:', e);
  }
}

        \u524D\u5F80 <a href="https://github.com/settings/tokens" target="_blank">GitHub \u8BBE\u7F6E\u9875</a> \u521B\u5EFA\u65B0 Token\u3002
      </div>
      <div class="error-msg" id="login-error"></div>
      <button class="btn" onclick="doLogin()" style="width:100%">\u767B\u5F55</button>
    </div>
  `);
  document.getElementById('token-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
}

async function doLogin() {
  const input = document.getElementById('token-input');
  const errEl = document.getElementById('login-error');
  const t = input.value.trim();
  if (!t) { errEl.textContent = '\u8BF7\u8F93\u5165 Token'; errEl.style.display = 'block'; return; }

  token = t;
  try {
    const resp = await fetch(`${API}/user`, {
      headers: { 'Authorization': `token ${token}`, 'User-Agent': 'shenkephoto-cms' }
    });
    if (!resp.ok) throw new Error('Token \u65E0\u6548');
    const user = await resp.json();
    // Verify repo access
    const repoResp = await fetch(`${API}/repos/${REPO_OWNER}/${REPO_NAME}`, {
      headers: { 'Authorization': `token ${token}`, 'User-Agent': 'shenkephoto-cms' }
    });
    if (!repoResp.ok) throw new Error('\u65E0\u6CD5\u8BBF\u95EE\u4ED3\u5E93\uFF0C\u8BF7\u786E\u8BA4 Token \u6709 repo \u6743\u9650');
    localStorage.setItem('gh_token', token);
    renderApp();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    token = '';
  }
}

function doLogout() {
  localStorage.removeItem('gh_token');
  token = '';
  renderLogin();
}

// ===== Collection List =====
async function showCollection(key) {
  currentCollection = key;
  currentFile = null;
  // Update nav
  document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
  const navEl = document.getElementById(`nav-${key}`);
  if (navEl) navEl.classList.add('active');

  const col = COLLECTIONS[key];
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="loading"><div class="spinner"></div><br>\u52A0\u8F7D\u4E2D...</div>`;

  try {
    if (col.type === 'single') {
      // Single file collection - show edit button
      const { content, sha } = await ghGetJson(col.file);
      currentData = content;
      currentFile = { path: col.file, sha };
      renderSingleView(key, content);
    } else {
      // Multi file collection - list all files
      const files = await ghListDir(col.dir);
      const items = [];
      for (const f of files) {
        if (!f.name.endsWith('.json')) continue;
        const { content } = await ghGetJson(`${col.dir}/${f.name}`);
        items.push({ content, path: `${col.dir}/${f.name}`, sha: f.sha });
      }
      // Sort
      if (col.sortBy) {
        items.sort((a, b) => {
          const av = a.content[col.sortBy] || '';
          const bv = b.content[col.sortBy] || '';
          return col.sortDesc ? bv.localeCompare(av) : av.localeCompare(bv);
        });
      }
      renderListView(key, items);
    }
  } catch (err) {
    main.innerHTML = `<div class="empty"><div class="empty-icon">\u26A0\uFE0F</div><p>${err.message}</p></div>`;
  }
}

function renderListView(key, items) {
  const col = COLLECTIONS[key];
  const rows = items.map(item => {
    const title = item.content[col.titleField] || item.content.id || '(untitled)';
    const subtitle = col.subtitleField ? (item.content[col.subtitleField] || '') : '';
    const thumb = item.content.cover || item.content.image || item.content.thumbnail || '';
    // Show photo count for works
    let extraMeta = '';
    if (key === 'works' && item.content.photos) {
      extraMeta = ` · ${item.content.photos.length} 张照片`;
    }
    return `
      <div class="item-row">
        ${thumb ? `<img class="thumb" src="${thumb}" onerror="this.style.display='none'">` : ''}
        <div class="info">
          <div class="title">${escapeHtml(title)}</div>
          <div class="meta">${escapeHtml(subtitle)}${extraMeta}</div>
        </div>
        <div class="actions">
          <button class="btn btn-outline btn-sm" onclick="editItem('${key}','${item.path}')">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteItem('${key}','${item.path}')">删除</button>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('main-content').innerHTML = `
    <div class="main-header">
      <h2>${col.label}</h2>
      <div class="actions">
        <button class="btn btn-sm" onclick="newItem('${key}')">+ 新建</button>
      </div>
    </div>
    ${key === 'works' ? '<p style="color:var(--text-muted);font-size:13px;margin-bottom:16px;">每个系列是一个独立文件，包含系列信息和照片列表。点击「编辑」可管理系列内的照片。</p>' : ''}
    ${items.length === 0 ? `<div class="empty"><div class="empty-icon">\u{1F4C4}</div><p>还没有内容，点击右上角"新建"创建</p></div>` : `<div class="item-list">${rows}</div>`}
  `;
}

function renderSingleView(key, content) {
  const col = COLLECTIONS[key];
  document.getElementById('main-content').innerHTML = `
    <div class="main-header">
      <h2>${col.label}</h2>
      <div class="actions">
        <button class="btn btn-sm" onclick="editSingle('${key}')">\u7F16\u8F91\u5185\u5BB9</button>
      </div>
    </div>
    <div class="editor">
      ${renderReadonlyFields(col.fields, content)}
    </div>
  `;
}

function renderReadonlyFields(fields, data) {
  return fields.map(f => {
    let val = data[f.name];
    if (val === undefined || val === null) return '';
    if (f.type === 'list') {
      if (!Array.isArray(val) || val.length === 0) return '';
      const items = val.map(item => {
        const parts = f.fields.map(sf => item[sf.name] || '');
        return `<div style="padding:4px 0;border-bottom:1px solid #f0f0f0;">${escapeHtml(parts.join(' \u2014 '))}</div>`;
      }).join('');
      return `<div class="field"><label>${f.label}</label><div>${items}</div></div>`;
    }
    if (f.type === 'textarea' || f.type === 'richtext') {
      return `<div class="field"><label>${f.label}</label><div style="white-space:pre-wrap;color:#555;">${val || '(空)'}</div></div>`;
    }
    if (f.type === 'attachments') {
      if (!Array.isArray(val) || val.length === 0) return '';
      const items = val.map(att => `<div style="padding:4px 0;border-bottom:1px solid #f0f0f0;">${escapeHtml(att.fileName || '(未命名)')}</div>`).join('');
      return `<div class="field"><label>${f.label}</label><div>${items}</div></div>`;
    }
    return `<div class="field"><label>${f.label}</label><div>${escapeHtml(String(val))}</div></div>`;
  }).join('');
}

// ===== Editor =====
async function newItem(key) {
  currentFile = null;
  const col = COLLECTIONS[key];
  const defaultData = {};

  // Auto-generate ID for collections with autoId
  const idField = col.fields.find(f => f.autoId);
  let autoId = '';
  if (idField) {
    autoId = await autoGenerateId(key, idField.idPrefix || '');
  }

  col.fields.forEach(f => {
    if (f.default !== undefined) defaultData[f.name] = f.default;
    else if (f.type === 'list') defaultData[f.name] = [];
    else if (f.autoId) defaultData[f.name] = autoId;
    else defaultData[f.name] = '';
  });
  renderEditor(key, defaultData, null);
}

async function autoGenerateId(key, prefix) {
  const col = COLLECTIONS[key];
  try {
    const files = await ghListDir(col.dir);
    let maxNum = 0;
    files.forEach(f => {
      if (!f.name.endsWith('.json')) return;
      const name = f.name.replace('.json', '');
      if (name.startsWith(prefix)) {
        const num = parseInt(name.slice(prefix.length));
        if (!isNaN(num) && num > maxNum) maxNum = num;
      }
    });
    return prefix + (maxNum + 1);
  } catch (e) {
    return prefix + '1';
  }
}

async function editItem(key, path) {
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="loading"><div class="spinner"></div><br>\u52A0\u8F7D\u4E2D...</div>`;
  try {
    const { content, sha } = await ghGetJson(path);
    currentFile = { path, sha };
    renderEditor(key, content, sha);
  } catch (err) {
    main.innerHTML = `<div class="empty"><div class="empty-icon">\u26A0\uFE0F</div><p>${err.message}</p></div>`;
  }
}

function editSingle(key) {
  renderEditor(key, currentData, currentFile?.sha);
}

function renderEditor(key, data, sha) {
  const col = COLLECTIONS[key];
  const fieldsHtml = col.fields.map(f => renderField(f, data[f.name])).join('');

  document.getElementById('main-content').innerHTML = `
    <a class="back-link" href="#" onclick="showCollection('${key}');return false">\u2190 \u8FD4\u56DE${col.label}</a>
    <div class="main-header">
      <h2>${currentFile ? '\u7F16\u8F91' : '\u65B0\u5EFA'}${col.label}</h2>
    </div>
    <div class="editor" id="editor-form">
      ${fieldsHtml}
      <div class="editor-actions">
        <button class="btn" onclick="saveItem('${key}', ${sha ? `'${sha}'` : 'null'})">\u4FDD\u5B58</button>
        <button class="btn btn-outline" onclick="showCollection('${key}')">\u53D6\u6D88</button>
      </div>
    </div>
  `;
  // Bind thumbnail auto-update for existing photo list items
  bindPhotoThumbUpdates();
  // Bind RTE toolbar events
  bindRTEToolbars();
}

function bindPhotoThumbUpdates() {
  document.querySelectorAll('img[data-photo-thumb]').forEach(thumb => {
    const fieldName = thumb.dataset.photoThumb;
    const idx = thumb.dataset.photoIdx;
    const srcField = thumb.dataset.photoSrcField;
    const input = document.querySelector(`input[data-list-key="${fieldName}"][data-list-idx="${idx}"][data-sub-key="${srcField}"]`);
    if (input) {
      input.addEventListener('input', function() {
        thumb.src = this.value;
        thumb.style.opacity = this.value ? '1' : '0.3';
      });
    }
  });
}

function handleImageUpload(btn, inputSelector, thumbSelector) {
  const isAttach = inputSelector && inputSelector.includes('attach');
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = isAttach ? '.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.txt,.rtf,image/*' : 'image/*';
  fileInput.onchange = function() {
    if (!fileInput.files[0]) return;
    const file = fileInput.files[0];
    const maxSize = isAttach ? 10 * 1024 * 1024 : 5 * 1024 * 1024;
    if (file.size > maxSize) {
      const maxMB = isAttach ? '10MB' : '5MB';
      toast('文件大小不能超过' + maxMB, 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = '上传中...';
    uploadAnyFile(file, isAttach, function(url) {
      let input = null;
      if (inputSelector) {
        input = document.querySelector(inputSelector);
      } else {
        const wrap = btn.closest('.image-input-wrap') || btn.parentElement;
        input = wrap.querySelector('input[type="text"]');
      }
      if (input) {
        input.value = url;
        input.dispatchEvent(new Event('input'));
      }
      if (thumbSelector) {
        const thumb = document.querySelector(thumbSelector);
        if (thumb) { thumb.src = url; thumb.style.opacity = '1'; }
      } else {
        const listItem = btn.closest('.list-field');
        if (listItem) {
          const thumb = listItem.querySelector('.photo-thumb');
          if (thumb) { thumb.src = url; thumb.style.opacity = '1'; }
        }
      }
      btn.disabled = false;
      btn.textContent = '上传';
      toast('上传成功');
    }, function(err) {
      btn.disabled = false;
      btn.textContent = '上传';
      toast('上传失败: ' + err, 'error');
    });
  };
  fileInput.click();
}

function uploadAnyFile(file, isAttach, onSuccess, onError) {
  const reader = new FileReader();
  reader.onload = async function(e) {
    const base64 = e.target.result.split(',')[1];
    const safeName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_').toLowerCase();
    const filename = `${Date.now()}_${safeName}`;
    const dir = isAttach ? 'public/files' : 'public/images';
    const path = `${dir}/${filename}`;

    try {
      const body = {
        message: `Upload file: ${filename}`,
        content: base64,
        branch: REPO_BRANCH,
      };
      const resp = await ghApi(`/contents/${path}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const fileUrl = `https://cdn.jsdelivr.net/gh/${REPO_OWNER}/${REPO_NAME}@${REPO_BRANCH}/${dir}/${filename}`;
      onSuccess(fileUrl);
    } catch (err) {
      onError(err.message);
    }
  };
  reader.onerror = () => onError('文件读取失败');
  reader.readAsDataURL(file);
}

function renderField(field, value) {
  const val = value !== undefined && value !== null ? value : (field.default || '');
  const req = field.required ? '<span class="req">*</span>' : '';

  if (field.type === 'textarea') {
    return `<div class="field" data-field="${field.name}">
      <label>${field.label} ${req}</label>
      <textarea data-key="${field.name}">${escapeHtml(String(val))}</textarea>
    </div>`;
  }

  if (field.type === 'richtext') {
    const safeVal = String(val || '');
    return `<div class="field" data-field="${field.name}">
      <label>${field.label} ${req}</label>
      <div class="rte-toolbar" data-rte-toolbar="${field.name}">
        <button type="button" data-cmd="bold" title="加粗">B</button>
        <button type="button" data-cmd="italic" title="斜体">I</button>
        <span class="sep"></span>
        <button type="button" data-cmd="formatBlock" data-arg="h2" title="大标题">H2</button>
        <button type="button" data-cmd="formatBlock" data-arg="h3" title="小标题">H3</button>
        <span class="sep"></span>
        <button type="button" data-cmd="insertUnorderedList" title="无序列表">•</button>
        <button type="button" data-cmd="insertOrderedList" title="有序列表">1.</button>
        <span class="sep"></span>
        <button type="button" data-cmd="createLink" title="插入链接">🔗</button>
        <button type="button" data-cmd="insertImage" title="插入图片">🖼</button>
        <button type="button" data-cmd="insertVideo" title="插入视频">🎬</button>
        <button type="button" data-cmd="formatBlock" data-arg="blockquote" title="引用">❝</button>
        <span class="sep"></span>
        <button type="button" data-cmd="insertHorizontalRule" title="分隔线">—</button>
        <button type="button" data-cmd="removeFormat" title="清除格式">Tx</button>
      </div>
      <div class="rte-editor" contenteditable="true" data-key="${field.name}">${safeVal}</div>
    </div>`;
  }

  if (field.type === 'attachments') {
    const items = Array.isArray(val) ? val : [];
    const itemsHtml = items.map((att, idx) =>
      `<div class="attach-item" data-attach-idx="${idx}">
        <span class="attach-num">#${idx + 1}</span>
        <input type="text" data-attach-key="${field.name}" data-attach-idx="${idx}" data-attach-sub="fileName" placeholder="文件名（如：文章全文.pdf）" value="${escapeHtml(att.fileName || '')}">
        <input type="text" data-attach-key="${field.name}" data-attach-idx="${idx}" data-attach-sub="fileUrl" placeholder="文件下载链接（URL）" value="${escapeHtml(att.fileUrl || '')}">
        <button type="button" class="btn btn-outline btn-sm" onclick="handleImageUpload(this, 'input[data-attach-key=\\'${field.name}\\'][data-attach-idx=\\'${idx}\\'][data-attach-sub=\\'fileUrl\\']')">上传</button>
        <button type="button" class="btn btn-danger btn-sm" onclick="removeAttachItem('${field.name}', ${idx})">×</button>
      </div>`
    ).join('');
    return `<div class="field" data-field="${field.name}">
      <label>${field.label} ${req}</label>
      <div class="hint" style="margin-bottom:10px;">支持上传Word、PDF等文件。上传后生成下载链接。</div>
      <div id="attach-container-${field.name}">${itemsHtml || '<div style="color:var(--text-muted);font-size:13px;padding:8px 0;">暂无附件</div>'}</div>
      <button class="list-add" type="button" onclick="addAttachItem('${field.name}')">+ 添加附件</button>
    </div>`;
  }

  if (field.type === 'select') {
    const opts = field.options.map(o =>
      `<option value="${o.value}" ${val === o.value ? 'selected' : ''}>${o.label}</option>`
    ).join('');
    return `<div class="field" data-field="${field.name}">
      <label>${field.label} ${req}</label>
      <select data-key="${field.name}">${opts}</select>
    </div>`;
  }

  if (field.type === 'date') {
    return `<div class="field" data-field="${field.name}">
      <label>${field.label} ${req}</label>
      <input type="date" data-key="${field.name}" value="${escapeHtml(String(val))}">
    </div>`;
  }

  if (field.type === 'number') {
    return `<div class="field" data-field="${field.name}">
      <label>${field.label} ${req}</label>
      <input type="number" data-key="${field.name}" value="${escapeHtml(String(val))}">
    </div>`;
  }

  if (field.type === 'list') {
    const items = Array.isArray(val) ? val : [];
    const imageField = field.fields.find(f => f.name === 'src' || f.name === 'image' || f.name === 'thumbnail');
    const isPhotoList = !!imageField;

    const itemHtml = items.map((item, idx) => {
      const subFields = field.fields.map(sf => {
        if (isImageField(sf.name)) {
          return `<div class="field"><label>${sf.label}</label>
            <div class="image-input-wrap">
              <input type="text" data-list-key="${field.name}" data-list-idx="${idx}" data-sub-key="${sf.name}" value="${escapeHtml(String(item[sf.name] || ''))}">
              <button type="button" class="btn btn-outline btn-sm" onclick="handleImageUpload(this)">\u4E0A\u4F20</button>
            </div></div>`;
        }
        return `<div class="field"><label>${sf.label}</label>
        <input type="text" data-list-key="${field.name}" data-list-idx="${idx}" data-sub-key="${sf.name}" value="${escapeHtml(String(item[sf.name] || ''))}"></div>`;
      }).join('');

      if (isPhotoList) {
        const imgSrc = item[imageField.name] || '';
        return `<div class="list-field" data-list-item="${field.name}" data-list-idx="${idx}">
          <div class="list-item-header">
            <span>#${idx + 1}</span>
            <button onclick="removeListItem('${field.name}', ${idx})">\u5220\u9664</button>
          </div>
          <div class="photo-list-item">
            <img class="photo-thumb" src="${escapeHtml(imgSrc)}" onerror="this.style.opacity='0.3'" data-photo-thumb="${field.name}" data-photo-idx="${idx}" data-photo-src-field="${imageField.name}">
            <div class="photo-fields">${subFields}</div>
          </div>
        </div>`;
      }

      return `<div class="list-field" data-list-item="${field.name}" data-list-idx="${idx}">
        <div class="list-item-header">
          <span>#${idx + 1}</span>
          <button onclick="removeListItem('${field.name}', ${idx})">\u5220\u9664</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">${subFields}</div>
      </div>`;
    }).join('');

    return `<div class="field" data-field="${field.name}">
      <label>${field.label}</label>
      <div id="list-container-${field.name}">${itemHtml}</div>
      <button class="list-add" onclick="addListItem('${field.name}')">+ \u6DFB\u52A0\u4E00\u9879</button>
    </div>`;
  }

  // Default: text input
  if (field.autoId) {
    if (currentFile) {
      // Editing: show read-only
      return `<div class="field" data-field="${field.name}">
        <label>${field.label}</label>
        <div style="padding:10px 12px;background:#f5f5f5;border:1px solid var(--border);border-radius:var(--radius);color:#888;font-family:monospace;font-size:14px;">${escapeHtml(String(val))}</div>
        <input type="hidden" data-key="${field.name}" value="${escapeHtml(String(val))}">
      </div>`;
    }
    // Creating new: hidden
    return `<div class="field" data-field="${field.name}" style="display:none;"><input type="hidden" data-key="${field.name}" value="${escapeHtml(String(val))}"></div>`;
  }
  if (isImageField(field.name)) {
    return `<div class="field" data-field="${field.name}">
      <label>${field.label} ${req}</label>
      <div class="image-input-wrap">
        <input type="text" data-key="${field.name}" value="${escapeHtml(String(val))}">
        <button type="button" class="btn btn-outline btn-sm" onclick="handleImageUpload(this)">\u4E0A\u4F20</button>
      </div>
    </div>`;
  }
  return `<div class="field" data-field="${field.name}">
    <label>${field.label} ${req}</label>
    <input type="text" data-key="${field.name}" value="${escapeHtml(String(val))}">
  </div>`;
}

function addListItem(fieldName) {
  const col = COLLECTIONS[currentCollection];
  const field = col.fields.find(f => f.name === fieldName);
  const container = document.getElementById(`list-container-${fieldName}`);
  const idx = container.children.length;
  const subFields = field.fields.map(sf => {
    if (isImageField(sf.name)) {
      return `<div class="field"><label>${sf.label}</label>
        <div class="image-input-wrap">
          <input type="text" data-list-key="${fieldName}" data-list-idx="${idx}" data-sub-key="${sf.name}" value="">
          <button type="button" class="btn btn-outline btn-sm" onclick="handleImageUpload(this)">\u4E0A\u4F20</button>
        </div></div>`;
    }
    return `<div class="field"><label>${sf.label}</label>
    <input type="text" data-list-key="${fieldName}" data-list-idx="${idx}" data-sub-key="${sf.name}" value=""></div>`;
  }).join('');
  const div = document.createElement('div');
  div.className = 'list-field';
  div.dataset.listItem = fieldName;
  div.dataset.listIdx = idx;

  const imageField = field.fields.find(f => f.name === 'src' || f.name === 'image' || f.name === 'thumbnail');
  if (imageField) {
    div.innerHTML = `<div class="list-item-header"><span>#${idx + 1}</span><button onclick="removeListItem('${fieldName}', ${idx})">\u5220\u9664</button></div><div class="photo-list-item"><img class="photo-thumb" src="" style="opacity:0.3" data-photo-thumb="${fieldName}" data-photo-idx="${idx}" data-photo-src-field="${imageField.name}"><div class="photo-fields">${subFields}</div></div>`;
  } else {
    div.innerHTML = `<div class="list-item-header"><span>#${idx + 1}</span><button onclick="removeListItem('${fieldName}', ${idx})">\u5220\u9664</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">${subFields}</div>`;
  }
  container.appendChild(div);

  // Auto-update thumbnail when image URL field changes
  if (imageField) {
    const srcInput = div.querySelector(`input[data-sub-key="${imageField.name}"]`);
    if (srcInput) {
      srcInput.addEventListener('input', function() {
        const thumb = div.querySelector('.photo-thumb');
        if (thumb) {
          thumb.src = this.value;
          thumb.style.opacity = this.value ? '1' : '0.3';
        }
      });
    }
  }
}

function removeListItem(fieldName, idx) {
  const container = document.getElementById(`list-container-${fieldName}`);
  if (container.children[idx]) container.children[idx].remove();
  // Reindex
  Array.from(container.children).forEach((child, i) => {
    child.dataset.listIdx = i;
    child.querySelector('span').textContent = `#${i + 1}`;
    child.querySelectorAll('input').forEach(input => input.dataset.listIdx = i);
    const btn = child.querySelector('button');
    if (btn) btn.setAttribute('onclick', `removeListItem('${fieldName}', ${i})`);
    // Update thumbnail data index
    const thumb = child.querySelector('img[data-photo-thumb]');
    if (thumb) thumb.dataset.photoIdx = i;
  });
}

function collectFormData() {
  const col = COLLECTIONS[currentCollection];
  const data = {};

  // Regular fields
  col.fields.forEach(f => {
    if (f.type === 'list') {
      const container = document.getElementById(`list-container-${f.name}`);
      if (!container) { data[f.name] = []; return; }
      const items = [];
      Array.from(container.children).forEach(child => {
        const item = {};
        f.fields.forEach(sf => {
          const input = child.querySelector(`input[data-sub-key="${sf.name}"]`);
          item[sf.name] = input ? input.value : '';
        });
        items.push(item);
      });
      data[f.name] = items;
    } else if (f.type === 'richtext') {
      const editor = document.querySelector(`[data-key="${f.name}"]`);
      data[f.name] = editor ? editor.innerHTML : '';
    } else if (f.type === 'attachments') {
      const container = document.getElementById(`attach-container-${f.name}`);
      const items = [];
      if (container) {
        Array.from(container.querySelectorAll('.attach-item')).forEach(row => {
          const fnInput = row.querySelector('input[data-attach-sub="fileName"]');
          const fuInput = row.querySelector('input[data-attach-sub="fileUrl"]');
          const fileName = fnInput ? fnInput.value.trim() : '';
          const fileUrl = fuInput ? fuInput.value.trim() : '';
          if (fileName || fileUrl) {
            items.push({ fileName, fileUrl });
          }
        });
      }
      data[f.name] = items;
    } else {
      const input = document.querySelector(`[data-key="${f.name}"]`);
      if (input) {
        data[f.name] = f.type === 'number' ? (parseInt(input.value) || 0) : input.value;
      }
    }
  });

  return data;
}

async function saveItem(key, sha) {
  const col = COLLECTIONS[key];
  const data = collectFormData();
  const main = document.getElementById('main-content');

  // Disable save button
  const saveBtn = main.querySelector('.btn');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '\u4FDD\u5B58\u4E2D...'; }

  try {
    let path, message;
    if (col.type === 'single') {
      path = col.file;
      message = `Update ${col.label}`;
    } else {
      const id = data.id || data.title || 'untitled';
      path = `${col.dir}/${id}.json`;
      message = `${currentFile ? 'Update' : 'Create'} ${col.label}: ${data[col.titleField] || id}`;
    }

    const result = await ghSaveJson(path, data, sha || (currentFile?.sha), message);
    // If creating new multi-type content, add to manifest
    if (col.type === 'multi' && !currentFile) {
      const id = data.id || data.title || 'untitled';
      await updateManifest(key, id, 'add');
    }
    toast('\u4FDD\u5B58\u6210\u529F\uFF01\u7F51\u7AD9\u5C06\u572830\u79D2\u5185\u81EA\u52A8\u66F4\u65B0');
    // Go back to list
    setTimeout(() => showCollection(key), 1500);
  } catch (err) {
    toast('\u4FDD\u5B58\u5931\u8D25: ' + err.message, 'error');
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '\u4FDD\u5B58'; }
  }
}

async function deleteItem(key, path) {
  if (!confirm('\u786E\u8BA4\u5220\u9664\u8FD9\u4E2A\u6587\u4EF6\uFF1F\u6B64\u64CD\u4F5C\u4E0D\u53EF\u64A4\u9500\u3002')) return;
  try {
    const resp = await ghApi(`/contents/${path}`);
    const data = await resp.json();
    await ghDeleteFile(path, data.sha, `Delete ${path}`);
    // Remove from manifest if multi-type content
    const col = COLLECTIONS[key];
    if (col && col.type === 'multi') {
      const contentId = path.split('/').pop().replace('.json', '');
      await updateManifest(key, contentId, 'remove');
    }
    toast('\u5220\u9664\u6210\u529F\uFF01\u7F51\u7AD9\u5C06\u572830\u79D2\u5185\u81EA\u52A8\u66F4\u65B0');
    showCollection(key);
  } catch (err) {
    toast('\u5220\u9664\u5931\u8D25: ' + err.message, 'error');
  }
}

// ===== Rich Text Editor =====
function bindRTEToolbars() {
  document.querySelectorAll('[data-rte-toolbar]').forEach(toolbar => {
    const fieldName = toolbar.dataset.rteToolbar;
    const editor = document.querySelector(`[data-key="${fieldName}"]`);
    if (!editor) return;

    toolbar.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const cmd = this.dataset.cmd;
        const arg = this.dataset.arg || null;

        if (cmd === 'createLink') {
          const url = prompt('请输入链接URL:');
          if (url) document.execCommand(cmd, false, url);
        } else if (cmd === 'insertImage') {
          currentRTEEditor = editor;
          showImageModal();
        } else if (cmd === 'insertVideo') {
          currentRTEEditor = editor;
          const url = prompt('请输入视频嵌入链接（支持 Bilibili / YouTube / Vimeo 的 iframe 链接）：\n\n也可以直接粘贴视频页面地址。');
          if (url) {
            // Build responsive video wrapper
            let embedUrl = url.trim();
            // Auto-convert common video URLs to embed format if needed
            const wrapper = '<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;max-width:100%;margin:1.5em 0;"><iframe src="' + escapeHtml(embedUrl) + '" style="position:absolute;top:0;left:0;width:100%;height:100%;" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
            document.execCommand('insertHTML', false, wrapper);
          }
        } else if (cmd === 'formatBlock') {
          document.execCommand(cmd, false, arg);
        } else {
          document.execCommand(cmd, false, null);
        }
        editor.focus();
      });
    });
  });

  // Bind image modal buttons (only once)
  bindImageModal();
}

let imageModalBound = false;
function bindImageModal() {
  if (imageModalBound) return;
  imageModalBound = true;

  const modal = document.getElementById('rte-img-modal');
  if (!modal) return;

  // Upload button
  document.getElementById('rte-img-upload')?.addEventListener('click', function() {
    hideImageModal();
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.onchange = function() {
      if (!fileInput.files[0]) return;
      const file = fileInput.files[0];
      if (file.size > 5 * 1024 * 1024) {
        toast('图片大小不能超过5MB', 'error');
        return;
      }
      uploadAnyFile(file, false, function(url) {
        if (currentRTEEditor) {
          currentRTEEditor.focus();
          document.execCommand('insertImage', false, url);
          toast('图片已插入');
        }
      }, function(err) {
        toast('上传失败: ' + err, 'error');
      });
    };
    fileInput.click();
  });

  // URL button
  document.getElementById('rte-img-url')?.addEventListener('click', function() {
    hideImageModal();
    setTimeout(() => {
      const url = prompt('请输入图片链接URL:');
      if (url && currentRTEEditor) {
        currentRTEEditor.focus();
        document.execCommand('insertImage', false, url.trim());
      }
    }, 200);
  });

  // Cancel button
  document.getElementById('rte-img-cancel')?.addEventListener('click', hideImageModal);

  // Close on backdrop click
  modal.addEventListener('click', function(e) {
    if (e.target === modal) hideImageModal();
  });
}

function showImageModal() {
  const modal = document.getElementById('rte-img-modal');
  if (modal) modal.style.display = 'flex';
}

function hideImageModal() {
  const modal = document.getElementById('rte-img-modal');
  if (modal) modal.style.display = 'none';
}

// ===== Attachments =====
function addAttachItem(fieldName) {
  const container = document.getElementById(`attach-container-${fieldName}`);
  // Remove empty placeholder if present
  const placeholder = container.querySelector('div:not(.attach-item)');
  if (placeholder) placeholder.remove();

  const idx = container.querySelectorAll('.attach-item').length;
  const div = document.createElement('div');
  div.className = 'attach-item';
  div.dataset.attachIdx = idx;
  div.innerHTML = `<span class="attach-num">#${idx + 1}</span>
    <input type="text" data-attach-key="${fieldName}" data-attach-idx="${idx}" data-attach-sub="fileName" placeholder="文件名（如：文章全文.pdf）">
    <input type="text" data-attach-key="${fieldName}" data-attach-idx="${idx}" data-attach-sub="fileUrl" placeholder="文件下载链接（URL）">
    <button type="button" class="btn btn-outline btn-sm" onclick="handleImageUpload(this, 'input[data-attach-key=\\'${fieldName}\\'][data-attach-idx=\\'${idx}\\'][data-attach-sub=\\'fileUrl\\']')">上传</button>
    <button type="button" class="btn btn-danger btn-sm" onclick="removeAttachItem('${fieldName}', ${idx})">×</button>`;
  container.appendChild(div);
}

function removeAttachItem(fieldName, idx) {
  const container = document.getElementById(`attach-container-${fieldName}`);
  const items = container.querySelectorAll('.attach-item');
  if (items[idx]) items[idx].remove();
  // Reindex
  const remaining = container.querySelectorAll('.attach-item');
  remaining.forEach((item, i) => {
    item.dataset.attachIdx = i;
    item.querySelector('.attach-num').textContent = `#${i + 1}`;
    item.querySelectorAll('input').forEach(input => input.dataset.attachIdx = i);
    const btns = item.querySelectorAll('button');
    if (btns.length >= 2) {
      btns[0].setAttribute('onclick', `handleImageUpload(this, 'input[data-attach-key=\\'${fieldName}\\'][data-attach-idx=\\'${i}\\'][data-attach-sub=\\'fileUrl\\']')`);
      btns[1].setAttribute('onclick', `removeAttachItem('${fieldName}', ${i})`);
    }
  });
  // Show placeholder if empty
  if (remaining.length === 0) {
    container.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:8px 0;">暂无附件</div>';
  }
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
